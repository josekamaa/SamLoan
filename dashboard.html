<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SAM Loans</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h1>SAM Loans</h1>
            </div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="dashboard.html">Dashboard</a>
                <a href="admin.html">Admin</a>
                <button id="authBtn" class="btn btn-primary" onclick="handleLogout()">Logout</button>
            </div>
        </div>
    </nav>

    <section class="dashboard">
        <div class="container">
            <div class="dashboard-header">
                <h1>My Dashboard</h1>
                <p id="userGreeting">Welcome, User!</p>
            </div>

            <!-- Stats -->
            <div class="dashboard-grid">
                <div class="dashboard-card">
                    <h3>Active Loans</h3>
                    <p class="amount" id="activeLoans">0</p>
                </div>
                <div class="dashboard-card">
                    <h3>Total Borrowed</h3>
                    <p class="amount" id="totalBorrowed">₦0</p>
                </div>
                <div class="dashboard-card">
                    <h3>Outstanding Balance</h3>
                    <p class="amount" id="outstandingBalance">₦0</p>
                </div>
                <div class="dashboard-card">
                    <h3>Next Payment</h3>
                    <p class="amount" id="nextPayment">₦0</p>
                </div>
            </div>

            <!-- Apply for Loan -->
            <div class="loan-form">
                <h2>Apply for a Loan</h2>
                <form id="loanApplicationForm" onsubmit="submitLoanApplication(event)">
                    <div class="form-group">
                        <label for="loanAmount">Loan Amount (₦)</label>
                        <input type="number" id="loanAmount" required min="50000" max="5000000" placeholder="Enter amount">
                    </div>
                    <div class="form-group">
                        <label for="loanPurpose">Purpose of Loan</label>
                        <select id="loanPurpose" required>
                            <option value="">Select purpose</option>
                            <option value="business">Business</option>
                            <option value="education">Education</option>
                            <option value="medical">Medical</option>
                            <option value="personal">Personal</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="loanTenure">Repayment Period (months)</label>
                        <select id="loanTenure" required>
                            <option value="3">3 months</option>
                            <option value="6">6 months</option>
                            <option value="12">12 months</option>
                            <option value="24">24 months</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="loanDescription">Brief Description</label>
                        <textarea id="loanDescription" placeholder="Describe why you need this loan..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Submit Application</button>
                </form>
            </div>

            <!-- Loan History -->
            <div class="loan-list">
                <h2>My Loan Applications</h2>
                <div id="loanHistory"></div>
            </div>
        </div>
    </section>

    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
